[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"
[project]
name = "netucs"
dynamic = ["version"]
description = "Conductor-scheduled C++ UDP networking with Python bindings"
requires-python = ">=3.9"
dependencies = ["protobuf>=3.20.3,<7"]
[project.optional-dependencies]
numpy = ["numpy>=1.20"]
[tool.scikit-build]
wheel.packages = {"netucs" = "src"}

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'
